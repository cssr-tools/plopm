name: Run plopm

on:
 pull_request:
   
jobs:
  run-plopm-local:
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v5
    
    - name: Install Flow Simulator
      run: |
        sudo apt-get update
        sudo apt-get install software-properties-common
        sudo apt-add-repository ppa:opm/ppa
        sudo apt-get update
        sudo apt-get install mpi-default-bin libopm-simulators-bin

    - name: Install optional (but recommended) plotting (LaTeX) dependencies
      run: |
        sudo apt-get install texlive-fonts-recommended texlive-fonts-extra dvipng cm-super
        
    - name: Install plopm and python requirements
      run: |
        python3.14 -m venv vplopm
        . vplopm/bin/activate
        echo "$PWD/vplopm/bin" >> $GITHUB_PATH
        pip install --upgrade pip setuptools wheel
        pip install .
        pip install -r dev-requirements.txt
        
    - name: Check code style and linting 
      run: |
        black --target-version py314 src/ tests/ examples/ --check
        pylint src/ tests/ examples/
        ruff check src/ tests/ examples/
        mypy --ignore-missing-imports src/ tests/ examples/
      
    - name: Run the tests
      run: |
        pytest --cov=plopm --cov-report term-missing --basetemp=test_outputs tests/ --exitfirst
        
    - name: Build documentation
      run: |
        pushd docs
        make html SPHINXOPTS="-W"
